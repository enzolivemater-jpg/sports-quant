name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Validate F1 repository boundaries
        run: uv run python scripts/validate_f1.py
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Unit and smoke tests
        run: uv run pytest -m "not integration"
      - name: Migration skeleton validation
        run: uv run alembic heads

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sports_quant_test
          POSTGRES_PASSWORD: sports_quant_test
          POSTGRES_DB: sports_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sports_quant_test -d sports_quant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPORTS_QUANT_TEST_DATABASE_URL: postgresql+psycopg://sports_quant_test:sports_quant_test@localhost:5432/sports_quant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: PostgreSQL integration smoke test
        run: uv run pytest -m integration
