name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Dependency audit
        run: uv run pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to list pull-request commits for PR-scoped scans.
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings fail the job and are reported in the job summary and SARIF
          # artifact; PR review comments are disabled to avoid needing write scope.
          GITLEAKS_ENABLE_COMMENTS: "false"
