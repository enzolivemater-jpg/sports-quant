name: Bootstrap uv lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-lock.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Generate uv.lock
        run: uv lock
      - name: Commit lockfile if changed
        run: |
          test -f uv.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
          else
            git commit -m "chore: refresh uv lockfile"
            git push origin HEAD:main
          fi
