name: Format governance once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Apply Ruff formatter
        run: uv run ruff format scripts/validate_governance.py tests/unit/test_governance_validator.py
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "sports-quant-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate_governance.py tests/unit/test_governance_validator.py
          git commit -m "style: apply Ruff formatter [skip format-once]"
          git push origin HEAD:main
