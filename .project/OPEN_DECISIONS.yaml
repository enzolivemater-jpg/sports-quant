mandatory_sports_scope_amendment:
  adr: ADR-0002
  approved_by: Enzo
  approved_at: 2026-09-22
  mandatory_sports:
    - BASKETBALL
    - FOOTBALL
    - MMA
  mma_initial_competition_scope:
    - UFC
  optional_sports_rule: EMPIRICAL_SPORT_PREDICTABILITY_ONLY
  note: >-
    OD-29 no longer asks whether Basketball/MMA belong in scope; that inclusion is resolved.
    OD-29 now tracks only the still-undefined competition/market-family details needed before implementation.
