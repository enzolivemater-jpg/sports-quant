schema_version = "1.1"
project = "SPORTS_QUANT"
purpose = "Auditable mirror of the immutable F1 source baseline enforced by validate_phase_gates.py"

allowed_source_files = [
  "src/sports_quant/__init__.py",
  "src/sports_quant/config/__init__.py",
  "src/sports_quant/config/settings.py",
  "src/sports_quant/db/__init__.py",
  "src/sports_quant/db/engine.py",
  "src/sports_quant/observability/__init__.py",
  "src/sports_quant/observability/logging.py",
]

[scaffold]
allowed_filename = "README.md"

[rule]
description = "While f2.authorized=false, files under src must be an exact frozen F1 source blob or a README.md scaffold. This TOML cannot broaden the canonical set; the validator enforces the exact paths and blob SHAs."
